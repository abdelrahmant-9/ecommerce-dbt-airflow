version: 2

models:
  - name: fct_orders
    description: One row per order with totals.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: dim_customers
    description: Customer dimension with lifetime value and loyalty tier.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: tier
        data_tests:
          - accepted_values:
              arguments:
                values: [gold, silver, bronze]
  - name: mart_daily_revenue
    columns:
      - name: order_date
        data_tests: [unique, not_null]
  - name: mart_product_performance
